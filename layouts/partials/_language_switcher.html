{{ with .Translations }}
    <nav class="language-switcher" aria-label="Language">
        {{ range . }}
            <a
                href="{{ .RelPermalink }}"
                hreflang="{{ .Language.Lang }}"
                lang="{{ .Language.Lang }}"
                title="{{ .Language.Label }}"
            >
                <i class="fas fa-language" aria-hidden="true"></i>
                <span>{{ .Language.Label }}</span>
            </a>
        {{ end }}
    </nav>
{{ end }}
