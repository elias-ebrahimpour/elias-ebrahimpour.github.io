{{ if .BasicInfo.Contacts }}
<div class="contacts">
    <ul>
        {{ range .BasicInfo.Contacts }}
        <li class="contacts__item">
            <a href="{{ .Link }}" target="_blank" rel="noopener noreferrer">
                <i class="{{ .Icon }}"></i>
            </a>
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
