Profile: توسعه دهنده سمت سرور با تمرکز روی پایتون و ۴ سال تجربه در طراحی و توسعه سیستم های ماکروسرویسی با توان پردازش بالا برای پلتفرم های هاستینگ و زیرساخت ابری. سرویس های مبتنی بر FastAPI و Django را در چند دیتاسنتر طراحی و پیاده سازی کرده ام و با استفاده از پردازش غیرهمزمان و بهینه سازی دیتابیس، هزینه زیرساخت را ۴۰٪ و زمان پردازش مهاجرت را ۲۵٪ کاهش داده ام. تجربه کار با Docker، Kubernetes، PostgreSQL، سیستم های توزیع شده و زیرساخت های عملیاتی را دارم.

